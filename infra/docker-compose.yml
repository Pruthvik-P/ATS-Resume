name: ats-engine

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
      POSTGRES_DB: ats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Reserved for the Phase 2 cache and job queue (Celery/Redis).
  # The API does not require it yet.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Sandboxed LaTeX compiler. The API talks to it over the internal-only
  # `latex_internal` network; the worker has no route to the internet.
  latex_worker:
    build:
      context: ../services/latex_worker
    environment:
      WORKER_PORT: "8099"
      WORKER_TIMEOUT_SECONDS: "45"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    networks:
      - latex_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  api:
    build:
      context: ../apps/api
    environment:
      ATS_ENVIRONMENT: production
      ATS_DATABASE_URL: postgresql+psycopg://ats:ats@postgres:5432/ats
      ATS_AUTO_CREATE_TABLES: "false"
      ATS_ALLOWED_ORIGINS: http://localhost:3000
      ATS_STORAGE_DIR: /data/uploads
      ATS_LLM_PROVIDER: stub
      ATS_API_KEY: ${ATS_API_KEY:-}
      # Compilation is opt-in. Set ATS_LATEX_COMPILE_ENABLED=true to enable the
      # sandboxed worker; ingestion still falls back to static analysis when it
      # is disabled or unavailable.
      ATS_LATEX_COMPILE_ENABLED: ${ATS_LATEX_COMPILE_ENABLED:-false}
      ATS_LATEX_COMPILE_ENGINE: auto
      ATS_LATEX_WORKER_URL: http://latex_worker:8099
      ATS_LATEX_COMPILE_TIMEOUT_SECONDS: "60"
      ATS_OCR_ENABLED: ${ATS_OCR_ENABLED:-false}
      # Phase 2 AI/NLP. Trained embeddings/rerankers are opt-in images/extras.
      ATS_LLM_STRUCTURING_ENABLED: ${ATS_LLM_STRUCTURING_ENABLED:-false}
      ATS_LLM_JUDGE_ENABLED: ${ATS_LLM_JUDGE_ENABLED:-false}
      ATS_EMBEDDING_PROVIDER: ${ATS_EMBEDDING_PROVIDER:-hashed}
      ATS_EMBEDDING_STORE_BACKEND: ${ATS_EMBEDDING_STORE_BACKEND:-json}
      ATS_JD_CACHE_BACKEND: ${ATS_JD_CACHE_BACKEND:-memory}
      ATS_REDIS_URL: redis://redis:6379/0
      ATS_FAIRNESS_REDACTION_ENABLED: ${ATS_FAIRNESS_REDACTION_ENABLED:-true}
      ATS_MULTI_JD_MAX_TARGETS: ${ATS_MULTI_JD_MAX_TARGETS:-5}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - latex_internal
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  web:
    build:
      context: ../apps/web
    environment:
      # Server-side only: the browser calls this container at /api/backend/*.
      API_BASE_URL: http://api:8000
      ATS_API_KEY: ${ATS_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    init: true

volumes:
  pgdata:
  uploads:

networks:
  # `internal: true` removes the default gateway, so the worker can only be
  # reached by containers attached to this network (the API).
  latex_internal:
    internal: true
